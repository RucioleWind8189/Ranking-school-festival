<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Time Attack Ranking</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: rgba(255,255,255,0.9);
        padding: 60px;
        border-radius: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        width: 1200px;
        text-align: center;
      }

      h2{
        font-size: 48px;
        margin-bottom: 40px;
      }

      li {
        font-size: 36px;
        margin-bottom: 40;
      }

      p {
        font-size: 28px;
        margin: 20px 0;
      }

      input, button {
        margin: 10px 0;
        padding: 16px;
        width: 80%;
        font-size: 24px;
        border-radius: 20px;
        border: 1px solid #ccc;
      }

      button {
        background-color: #007aff;
        color: white;
        border: none;
        cursor: pointer;
      }
      
      button:hover {
        background-color: #0066d6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [records, setRecords] = React.useState([]);
        const [name, setName] = React.useState("");
        const [time, setTime] = React.useState("");

        const addRecord = () => {
          if (!name || isNaN(parseFloat(time))) return;
          const newRecords = [...records, { name, time: parseFloat(time) }];
          newRecords.sort((a, b) => a.time - b.time);
          setRecords(newRecords);
          setName("");
          setTime("");
        };

        const avg = records.length
          ? (records.reduce((sum, r) => sum + r.time, 0) / records.length).toFixed(2)
          : "-";
        const best = records.length
          ? Math.min(...records.map((r) => r.time)).toFixed(2)
          : "-";

        return (
          <div className="card">
            <h2>🏁 Time Attack Ranking 🏁</h2>
            <ul style={{ listStyle: "none", padding: 0 }}>
              {records.slice(0, 5).map((r, i) => (
                <li key={i}>
                  {i + 1}位　{r.name}　{r.time.toFixed(2)}秒
                </li>
              ))}
            </ul>
            <hr />
            <p>平均タイム：{avg}秒　最高タイム：{best}秒</p>
            <input
              type="text"
              placeholder="名前"
              value={name}
              onChange={(e) => setName(e.target.value)}
            />
            <input
              type="number"
              step="0.01"
              placeholder="タイム（秒）"
              value={time}
              onChange={(e) => setTime(e.target.value)}
            />
            <button onClick={addRecord}>登録</button>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
